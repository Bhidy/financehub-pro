name: Pipeline Watchdog

# Dead-man's-switch for the ENTIRE data platform ($0 — GitHub Actions + Supabase
# + Discord only). Every 30 min it verifies:
#   1. every dataset is fresh vs a trading-calendar-aware SLA (outcome-based), and
#   2. every scheduled workflow actually fired (process-based — catches the
#      "cron silently never ran" bug that left 3 workflows dead).
# On any problem it AUTO-HEALS (dispatches the corrective workflow, cooldown-
# guarded) and alerts Discord. It writes a heartbeat to `pipeline_heartbeat`;
# data_sync.yml independently checks that heartbeat, so the watchdog itself is
# watched (no single blind spot), for free.
#
# Signal hygiene: the run ALWAYS writes the heartbeat, sends Discord, and fires
# every heal FIRST — then exits NON-ZERO (RED) iff a problem was left UNHEALED
# (no corrective workflow, --heal off, dispatch skipped/failed, or a human-only
# issue such as the runner-disk warning/critical). It stays GREEN when everything
# is healthy or every problem was successfully dispatched-for-heal (the heal IS
# the response). So a RED run WITH a heartbeat = a real problem outstanding; a
# MISSING heartbeat (watchdog itself dead / DB unreachable) is the separate signal
# that data_sync.yml's `--check-watchdog 480` independently cross-checks. The 480
# (8h) is grounded in MEASURED run history, NOT the cron schedule below — GitHub
# drops ~2/3 of the scheduled triggers (single saturated runner), so the watchdog
# really fires ~8×/day with gaps up to ~300 min. See the long note in data_sync.yml.
#
# Self-heal dispatch needs a token with actions:write. The default GITHUB_TOKEN
# can READ runs and the DB (so detection + alerting always work), but GitHub's
# recursion guard may stop it from STARTING other workflows. For guaranteed
# auto-heal, add a free fine-grained PAT as secret WATCHDOG_DISPATCH_TOKEN —
# the workflow uses it automatically if present. SCOPE IT actions:write AND
# Issues:write — notify.py's last-resort channel files a GitHub ISSUE, and an
# actions-only PAT cannot. (Defense in depth: GITHUB_TOKEN is also passed below
# so the issue channel still works even with a mis-scoped PAT.)

on:
  schedule:
    # Smart cadence — saves ~350 GitHub Actions minutes/month vs flat 30-min 24/7.
    # The watchdog's own calendar logic already skips intraday checks outside market
    # hours, so blanket 30-min runs at 01:39 AM are pure waste.
    #
    # Trading window (EGX, UTC): Sun–Thu 06:00–13:15 UTC
    - cron: '*/30 6-14 * * 0-4'   # every 30 min during EGX session (tight freshness SLA)
    - cron: '0 15,17,19,21,23 * * *'  # every 2 h post-close / evening (wall-days + schedule-liveness)
    - cron: '0 0,2,4 * * *'       # every 2 h overnight (0,2,4 UTC — quiet hours)
    - cron: '0 6,8,10,12,14 * * 5,6'  # every 2 h Fri/Sat daytime (fills the weekend gap)
    # REALITY CHECK (measured 2026-06-08→12): this schedule REQUESTS ~24 runs/day at
    # ≤2h spacing, but GitHub actually delivers only ~8/day with real gaps up to
    # ~300 min — `schedule` events are dropped when the single self-hosted runner is
    # busy with the other ~15 workflows (hosted runners are billing-blocked, so there
    # is no spare capacity). These extra cron lines still HELP (more requests → more
    # delivered runs) but do NOT guarantee tight spacing. That is why data_sync's
    # liveness probe uses 480 min (8h), sized to the MEASURED worst gap, not to this
    # theoretical schedule. Tight data-freshness is enforced separately by the
    # external UptimeRobot probe of /api/v1/health/freshness, independent of Actions.
  workflow_dispatch:

concurrency:
  group: pipeline-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write              # dispatch corrective workflows (self-heal)
  issues: write               # notify.py last-resort channel: alert → GitHub issue

jobs:
  watchdog:
    name: Freshness + schedule liveness + auto-heal
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install asyncpg
      - name: Run watchdog (detect + heal)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.WATCHDOG_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          # notify.py tries GH_TOKEN then GITHUB_TOKEN for the issue channel, so a
          # dispatch-only PAT above can never silence the last-resort alerts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Email channel (notify.py primary). Verified live 2026-06-12 — the
          # working account is mohamedbhidy@gmail.com; an earlier NOTIFICATION_EMAIL
          # mismatch (not a dead password) was the real cause of every SMTP 535.
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scripts/pipeline_watchdog.py --heal
