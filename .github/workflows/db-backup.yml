name: Database Backup (off-site)

# Free, off-site, retained, integrity-checked DB backup — fixes the DR gap where
# the only backup was a single pg_dump file on the Hetzner box itself
# (/app/backups/financehub_weekly.sql.gz), overwritten weekly, with no off-site
# copy, no history, and no restore verification. This dumps from the self-hosted
# runner, verifies the dump, and keeps each run as a versioned artifact — $0.
#
# CONNECTION: derived at runtime from the one living secret (DATABASE_URL,
# the pooled :6543 URL the whole platform uses) by swapping the port to :5432 —
# same Supavisor host in SESSION mode, which pg_dump requires. Verified
# 2026-06-11 from this runner: session :5432 connects (server_version 17.6).
# Deliberately NO second connection secret: a separate SUPABASE_DIRECT_URL
# rotted on day one (stale password copied from local .env → auth failure).
# Deriving from DATABASE_URL means one rotation point, zero drift. The derived
# string is ::add-mask::'ed immediately — GitHub only auto-masks exact secret
# values, never derived ones.
#
# CLIENT VERSION: the server is PostgreSQL 17.x, so pg_dump must be v17+.
# Ubuntu 24.04 ships client-16 only, and the runner user has no sudo — so the
# workflow self-installs postgresql-client-17 from the official PGDG apt repo
# (deb extracted to a persistent cache; no root needed; one-time download).
#
# SCOPE: --schema=public — all business data (market_tickers, ohlc_data,
# egx_*, mutual_funds, ...) lives in public. Supabase-managed schemas (auth,
# storage, realtime) are excluded: the postgres role cannot fully read them
# and they are not this platform's DR target.

on:
  schedule:
    - cron: '0 3 * * 4'     # Thursdays 03:00 UTC (weekly), matches the old tier7 slot
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump → verify → off-site artifact
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 30
    steps:
      - name: Ensure pg_dump 17 (PGDG, no sudo, cached)
        run: |
          set -euo pipefail
          # Prefer a system pg_dump if it's v17+ (installed on the host 2026-06-12).
          # The cache/PGDG-download path below stays as a self-healing fallback for
          # any runner where the system package is absent.
          SYS_PG="$(command -v pg_dump || true)"
          if [ -n "$SYS_PG" ] && "$SYS_PG" --version | grep -qE ' 1[7-9]| [2-9][0-9]'; then
            echo "system: $("$SYS_PG" --version)"
            { echo "PG17_BIN=$SYS_PG"; echo "PG17_LIB="; } >> "$GITHUB_ENV"
            exit 0
          fi
          CACHE="$HOME/.cache/financehub-pg17"
          PGBIN="$CACHE/usr/lib/postgresql/17/bin/pg_dump"
          LDP="$CACHE/usr/lib/x86_64-linux-gnu"
          if [ -x "$PGBIN" ] && LD_LIBRARY_PATH="$LDP" "$PGBIN" --version >/dev/null 2>&1; then
            echo "cached: $(LD_LIBRARY_PATH="$LDP" "$PGBIN" --version)"
          else
            echo "cache miss — fetching postgresql-client-17 from PGDG"
            rm -rf "$CACHE"
            mkdir -p "$CACHE"
            PGDG="https://apt.postgresql.org/pub/repos/apt"
            IDX="$CACHE/Packages"
            curl -fsSL --retry 3 "$PGDG/dists/noble-pgdg/main/binary-amd64/Packages.gz" | gzip -dc > "$IDX"
            CLIENT_PATH=$(awk '/^Package: postgresql-client-17$/{f=1} f && /^Filename:/{print $2; exit}' "$IDX")
            LIBPQ_PATH=$(awk '/^Package: libpq5$/{f=1} f && /^Filename:/{print $2; exit}' "$IDX")
            if [ -z "$CLIENT_PATH" ] || [ -z "$LIBPQ_PATH" ]; then
              echo "::error::could not resolve postgresql-client-17/libpq5 in the PGDG index"
              exit 1
            fi
            curl -fsSL --retry 3 -o "$CACHE/client.deb" "$PGDG/$CLIENT_PATH"
            curl -fsSL --retry 3 -o "$CACHE/libpq.deb" "$PGDG/$LIBPQ_PATH"
            dpkg -x "$CACHE/client.deb" "$CACHE"
            dpkg -x "$CACHE/libpq.deb" "$CACHE"
            rm -f "$CACHE/client.deb" "$CACHE/libpq.deb" "$IDX"
            LD_LIBRARY_PATH="$LDP" "$PGBIN" --version
          fi
          {
            echo "PG17_BIN=$PGBIN"
            echo "PG17_LIB=$LDP"
          } >> "$GITHUB_ENV"

      - name: Dump + verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set — cannot take a real backup."
            exit 1
          fi
          # Session-mode URL = same pooler host, port 5432 instead of 6543.
          DUMP_URL="${DATABASE_URL/:6543\//:5432/}"
          echo "::add-mask::$DUMP_URL"
          if [ "$DUMP_URL" = "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL does not contain ':6543/' — cannot derive the session-pooler URL."
            exit 1
          fi
          STAMP="$(date -u +%Y%m%d-%H%M)"
          # run_attempt suffix: a re-run in the same minute must not collide with
          # the failed attempt's artifact name (upload-artifact@v4 409s on dupes).
          OUT="financehub-${STAMP}-a${GITHUB_RUN_ATTEMPT:-1}.sql.gz"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          # --no-owner/--no-privileges keep the dump portable for restore into any DB.
          # LD_LIBRARY_PATH is scoped to this command only — it must not leak into
          # later steps (upload-artifact runs on node and a stray lib path can break it).
          LD_LIBRARY_PATH="$PG17_LIB" "$PG17_BIN" --schema=public --no-owner --no-privileges --format=plain "$DUMP_URL" | gzip -9 > "$OUT"
          # Integrity: gzip must be valid AND the dump must be plausibly large (a
          # failed/empty dump is a few bytes — never let that masquerade as a backup).
          gzip -t "$OUT"
          SIZE=$(stat -c%s "$OUT")
          echo "backup size: ${SIZE} bytes"
          if [ "$SIZE" -lt 102400 ]; then
            echo "::error::backup is only ${SIZE} bytes (<100KB) — almost certainly a failed/empty dump."
            exit 1
          fi
          # Sanity: core tables MUST appear as real objects (CREATE TABLE / COPY),
          # not mere mentions — and a missing core table is a FAILED backup, not a
          # warning (a backup without market data is a fake backup). Decompress
          # once to a file: grep -q on a zcat pipe SIGPIPEs zcat under pipefail.
          PLAIN="${RUNNER_TEMP:-/tmp}/financehub-dump-verify.sql"
          zcat "$OUT" > "$PLAIN"
          for t in market_tickers ohlc_data mutual_funds; do
            if ! grep -Eq "CREATE TABLE [^[:space:]]*\b${t}\b|^COPY [^[:space:]]*\b${t}\b" "$PLAIN"; then
              echo "::error::core table '${t}' missing from dump — backup is not valid."
              rm -f "$PLAIN"
              exit 1
            fi
          done
          rm -f "$PLAIN"
          echo "✓ backup verified: $OUT (${SIZE} bytes)"

      - name: Upload off-site artifact (retained, versioned)
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          retention-days: 30
          if-no-files-found: error

      # Retention prune — ON PURPOSE the last step of the BACKUP workflow:
      # rows are only ever deleted right after a verified, uploaded backup, so
      # anything pruned is always recoverable from today's artifact (audit M1:
      # egx_news and egx_ingest_deadletter grew unboundedly with no policy).
      - name: Retention prune (deadletter 30d, news 180d)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          PSQL="${PG17_BIN%pg_dump}psql"
          run_sql() { LD_LIBRARY_PATH="$PG17_LIB" "$PSQL" "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c "$1"; }
          DL=$(run_sql "WITH d AS (DELETE FROM egx_ingest_deadletter WHERE created_at < now() - interval '30 days' RETURNING 1) SELECT count(*) FROM d;")
          NEWS=$(run_sql "WITH d AS (DELETE FROM egx_news WHERE created_at < now() - interval '180 days' RETURNING 1) SELECT count(*) FROM d;")
          LEFT=$(run_sql "SELECT count(*) FROM egx_ingest_deadletter;")
          echo "pruned: deadletter=${DL} rows, news=${NEWS} rows | deadletter remaining=${LEFT}"
          # A big backlog AFTER pruning means a cycle is SYSTEMATICALLY dead-lettering
          # current rows — that's a live defect (taxonomy class), not history. Amber it.
          if [ "${LEFT}" -gt 5000 ]; then
            echo "::warning::egx_ingest_deadletter still has ${LEFT} rows after pruning — investigate which cycle is dead-lettering."
          fi
