name: Funds Gap Repair (Mubasher pages)

# ============================================================
# Repairs NAV history by re-reading each holed fund's own chart on Mubasher.
#
# WHY THIS EXISTS
# The platform has exactly one way to obtain HISTORY — a per-fund CSV — and
# everything else is a "today's price" trickle. So a missed day can never be
# recovered by any normal operation of the system. Measured across all 207
# published funds on 2026-09-07: 143 carry a genuine hole, 31,682 fund-days
# missing in total.
#
# scrape_mubasher reads a fund's FULL chart series off its page, so it is the
# one source that can go back for a specific date. It has been running daily
# and re-reading nothing: its resume guard skips any fund with more than ten
# points that was touched today, and the list-API sync touches every fund every
# morning. --gaps-only drives it from the gap ledger instead, where the guard is
# off by construction — a fund is on that list precisely because its history is
# incomplete.
#
# WHERE IT MATTERS MOST
# The newer funds have no per-fund CSV at all (the file is empty for every one
# checked). They live entirely on the daily one-price trickle, so when
# funds-nav-update failed six runs in a row from 15 to 20 August 2026, 17 funds
# lost those days permanently. This is the route back.
#
# SAFETY
#   · ON CONFLICT DO NOTHING — it fills holes, it never overwrites a held value.
#   · Rows are stamped `mubasher_page`, so its output stays distinguishable.
#   · The 2011 EGX closure (2011-01-27 → 2011-03-23) is excluded in SQL. That is
#     real market history; chasing it would be chasing a hole that belongs there.
#   · Only the ingested numeric-id universe is considered.
#
# NO SUDO ON THIS RUNNER, AND CHROMIUM NEEDS SYSTEM LIBRARIES ANYWAY.
# `playwright install --with-deps` apt-installs them as root and fails here; the
# browser then fails at LAUNCH with `libnspr4.so: cannot open shared object
# file`, which is a much later and more confusing place to discover it. So the
# libraries are downloaded as .debs and unpacked into a cache under the runner's
# home, with LD_LIBRARY_PATH pointed at it — exactly what db-backup.yml already
# does for postgresql-client-17 on this same box. It is cached, so it happens
# once, and a launch check runs before any fund is touched.
#
# CREDENTIALS
# Needs MUBASHER_USER and MUBASHER_PASS as repository secrets. Until they are
# set this workflow says so and exits 0, rather than reporting a red run every
# week for a known reason.
# ============================================================

on:
  schedule:
    # Saturdays 05:00 UTC — outside the Sun-Thu ingestion windows, and after the
    # Friday recovery jobs, so it only chases what they could not reach.
    - cron: '0 5 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'gaps repairs only the funds carrying a 90+ day hole (also the scheduled mode); test reads three funds and stops'
        required: true
        default: 'gaps'
        type: choice
        options: [gaps, test]

concurrency:
  group: funds-gap-repair
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: /home/github-runner/.cache/ms-playwright
  CHROME_DEPS: /home/github-runner/.cache/chromium-deps

jobs:
  repair:
    name: Re-read holed funds from their own Mubasher pages
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Are the credentials available?
        id: creds
        env:
          MUBASHER_USER: ${{ secrets.MUBASHER_USER }}
        run: |
          if [ -z "${MUBASHER_USER}" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=Dormant::MUBASHER_USER / MUBASHER_PASS are not set as repository secrets, so the gap repair cannot run."
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright and the browser
        if: steps.creds.outputs.have == 'yes'
        run: |
          set -euo pipefail
          pip install --quiet playwright asyncpg
          python -m playwright install chromium

      - name: Chromium's system libraries, without root
        if: steps.creds.outputs.have == 'yes'
        run: |
          set -euo pipefail
          LIBDIR="$CHROME_DEPS/usr/lib/x86_64-linux-gnu"
          if [ -f "$CHROME_DEPS/.ok" ]; then
            echo "cached: $(ls -1 "$LIBDIR" 2>/dev/null | wc -l) library files"
          else
            echo "cache miss — fetching Chromium's runtime libraries as .debs"
            rm -rf "$CHROME_DEPS"; mkdir -p "$CHROME_DEPS/debs"
            # Ubuntu 24.04 renamed several of these with a t64 suffix; both
            # spellings are listed and whichever resolves is taken.
            PKGS="libnspr4 libnss3 libnssutil3 libsmime3
                  libatk1.0-0t64 libatk1.0-0 libatk-bridge2.0-0t64 libatk-bridge2.0-0
                  libatspi2.0-0t64 libatspi2.0-0 libcups2t64 libcups2
                  libasound2t64 libasound2 libxkbcommon0 libxcomposite1 libxdamage1
                  libxfixes3 libxrandr2 libgbm1 libdrm2 libxshmfence1
                  libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libdbus-1-3"
            cd "$CHROME_DEPS/debs"
            GOT=0
            for p in $PKGS; do
              if apt-get download "$p" >/dev/null 2>&1; then GOT=$((GOT+1)); fi
            done
            echo "downloaded $GOT package(s)"
            if [ "$GOT" -eq 0 ]; then
              echo "::error::could not download any Chromium dependency. apt lists may be missing on this runner."
              exit 1
            fi
            for d in *.deb; do dpkg -x "$d" "$CHROME_DEPS"; done
            rm -f ./*.deb
            touch "$CHROME_DEPS/.ok"
            echo "unpacked: $(ls -1 "$LIBDIR" 2>/dev/null | wc -l) library files"
          fi
          # Ahead of the system path, so the unpacked copies win where they exist
          # and the system's own libraries still serve everything else.
          echo "LD_LIBRARY_PATH=$LIBDIR:$CHROME_DEPS/usr/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Can the browser actually start?
        if: steps.creds.outputs.have == 'yes'
        run: |
          set -euo pipefail
          # A missing shared library only shows at LAUNCH, and it would otherwise
          # surface fifty funds into the real run. Find out in five seconds.
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(headless=True,
                                              args=['--disable-blink-features=AutomationControlled'])
                  page = await b.new_page()
                  await page.goto('about:blank')
                  await b.close()
              print('chromium launches cleanly')

          asyncio.run(main())
          PY

      - name: Repair the gaps
        if: steps.creds.outputs.have == 'yes'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MUBASHER_USER: ${{ secrets.MUBASHER_USER }}
          MUBASHER_PASS: ${{ secrets.MUBASHER_PASS }}
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.mode }}" in
            test) python backend-core/scripts/scrape_mubasher.py --test ;;
            *)    python backend-core/scripts/scrape_mubasher.py --gaps-only ;;
          esac
