name: Funds NAV Update

# ============================================================
# PRIMARY mutual-fund NAV auto-update (the layer that replaces the dead
# /refresh/egypt-funds chart-API path, which returned HTTP 500 and reported
# false "egypt_funds_success" while NAVs silently froze for weeks).
#
# Engine: backend-core/scripts/funds_nav_updater.py
#   Layer 1 (primary)  static CSV  static.mubasher.info/.../priceChartFund_{id}.csv
#                      (no auth, fresh, full history) -> ~176 numeric-id funds
#   Layer 2 (fallback) english.mubasher.info JSON chart API (defensive)
#   Layer 3 (preserve) idempotent ON CONFLICT upsert -> never wipes a NAV
# Writes straight to Supabase (DATABASE_URL secret) -> no Hetzner/backend-lock
# dependency, so a backend outage cannot block funds updates.
#
# NEVER-FALSE-GREEN (2026-08-15: this claim was FALSE and is now enforced).
# --min-updated only proves TRANSPORT worked. A source that keeps returning
# HTTP 200 with an unchanged body passes it forever while publishing nothing —
# run 31722793365 reported 197,959 "points saved" when the universe was missing
# exactly two rows the source had, and exited 0. The run is now judged on
# INFORMATION GAIN as well: see the gate comments in the run step below.
#
# Funds with no CSV (newer 64xx ids) are covered by the Playwright scraper
# (backend scheduler 06:00 Cairo) — a separate, redundant layer.
#
# Requires repo secret DATABASE_URL (already configured for tv-egx-harvester).
# ============================================================

on:
  schedule:
    - cron: '0 5 * * 0-4'    # 08:00 Cairo, Sun-Thu (morning, after overnight CSV publish)
    - cron: '0 16 * * 0-4'   # 19:00 Cairo, Sun-Thu (evening, post-close redundancy)
  workflow_dispatch:
    inputs:
      scope:
        description: 'Universe to update'
        required: true
        default: 'numeric'
        type: choice
        options: [numeric, all]

concurrency:
  group: funds-nav-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update fund NAVs (Mubasher CSV)
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install httpx asyncpg

      - name: Run funds NAV updater
        id: run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          SCOPE="${{ github.event.inputs.scope }}"
          EXTRA=""
          if [ "$SCOPE" = "all" ]; then EXTRA="--all"; fi
          # THREE independent gates, because they answer different questions.
          #
          # --min-updated 100 is TRANSPORT: did fetching and writing work at all.
          #   With ~176 CSV-backed funds a healthy run clears 100 easily.
          #
          # --zero-gain-streak 6 is INFORMATION: is the source still PUBLISHING.
          #   Transport health alone is what stayed green from 2025-05 to 2026-06 —
          #   a frozen CSV serving HTTP 200 passes --min-updated forever while
          #   adding nothing. 6 runs = 3 trading days at 2 runs/day, so a weekend,
          #   a holiday, or a source that publishes late cannot page anyone, but a
          #   genuine freeze is caught within 72 hours instead of 13 months.
          #
          # --max-stale 60 is PER-FUND: how many funds have no NAV newer than 7d.
          #   Set just above today's known-degraded 46 so it catches the count
          #   GROWING rather than screaming about the backlog P4 will clear. Ratchet
          #   it down as the backfill lands; it must never be raised to silence a
          #   real regression.
          python backend-core/scripts/funds_nav_updater.py \
            --concurrency 10 --min-updated 100 \
            --zero-gain-streak 6 --max-stale 60 $EXTRA
