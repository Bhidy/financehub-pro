name: Runner Diagnostic (temporary preflight)

# TEMPORARY: controlled preflight for the db-backup root-cause fix. Collects
# host facts, proves the pg_dump path, and tests every candidate DB connection
# form from the EXACT environment that runs the backup (self-hosted runner,
# github-runner user). Dispatch-only. Every step is designed to exit 0 — this
# job reports evidence, it never pages. Removed once the backup is proven green.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: host facts + connectivity matrix + pg_dump proof
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 15
    steps:
      - name: Host facts
        run: |
          echo "== id =="
          id
          echo "== sudo =="
          if sudo -n true 2>/dev/null; then echo "SUDO=yes"; else echo "SUDO=no"; fi
          echo "== docker =="
          if docker version --format 'server={{.Server.Version}}' 2>/dev/null; then echo "DOCKER=yes"; else echo "DOCKER=no"; fi
          echo "== disk =="
          df -h /
          echo "== ipv6 global addrs =="
          ip -6 addr show scope global 2>/dev/null || echo "none"
          echo "== dns for db.kgjpkphfjmmiyjsgsaup.supabase.co =="
          echo "A:"
          getent ahostsv4 db.kgjpkphfjmmiyjsgsaup.supabase.co 2>/dev/null | awk '{print $1}' | sort -u || echo "none"
          echo "AAAA:"
          getent ahostsv6 db.kgjpkphfjmmiyjsgsaup.supabase.co 2>/dev/null | awk '{print $1}' | sort -u || echo "none"
          echo "== sshd effective auth/access rules =="
          grep -hsE '^(PasswordAuthentication|PubkeyAuthentication|PermitRootLogin|AllowUsers|AllowGroups|DenyUsers|DenyGroups|AuthenticationMethods|MaxStartups|PerSourcePenalties)' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf || echo "sshd config unreadable"
          echo "== intrusion guards =="
          for s in fail2ban crowdsec sshguard ufw; do
            state=$(systemctl is-active "$s" 2>/dev/null || true)
            echo "$s: ${state:-unknown}"
          done
          echo "== python =="
          python3 -c 'import asyncpg; print("asyncpg", asyncpg.__version__)' 2>/dev/null || echo "asyncpg missing"

      - name: pg_dump self-install probe (no sudo)
        run: |
          shopt -s nullglob
          if command -v pg_dump >/dev/null 2>&1; then
            pg_dump --version
            echo "PG_DUMP=system"
            exit 0
          fi
          PGDIR=$(mktemp -d /tmp/pgdiag.XXXXXX)
          if ! (cd "$PGDIR" && apt-get download postgresql-client-16 libpq5 >/dev/null 2>&1); then
            echo "PG_DUMP=download_failed"
            exit 0
          fi
          for deb in "$PGDIR"/*.deb; do
            dpkg -x "$deb" "$PGDIR"
          done
          BIN=$(find "$PGDIR" -name pg_dump -type f 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            echo "PG_DUMP=extract_failed"
            exit 0
          fi
          LIBDIR=$(find "$PGDIR/usr" -name 'libpq.so*' 2>/dev/null | head -1 | xargs -r dirname)
          echo "PG_BIN=$BIN" >> "$GITHUB_ENV"
          echo "PG_LIBDIR=${LIBDIR:-}" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="${LIBDIR:-}" "$BIN" --version
          echo "PG_DUMP=self_installed"

      - name: Connectivity matrix (server_version per URL form)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          python3 - <<'PY'
          import asyncio
          import os
          import re

          import asyncpg

          pooled = (os.environ.get("DATABASE_URL") or "").strip()
          direct = (os.environ.get("DIRECT_URL") or "").strip()
          session = re.sub(r":6543/", ":5432/", pooled, count=1) if pooled else ""

          async def probe(tag, dsn):
              if not dsn:
                  print(f"{tag}: EMPTY")
                  return
              try:
                  conn = await asyncio.wait_for(
                      asyncpg.connect(dsn=dsn, statement_cache_size=0, timeout=12), 15)
                  ver = await conn.fetchval("show server_version")
                  await conn.close()
                  print(f"{tag}: OK server_version={ver}")
              except Exception as exc:
                  print(f"{tag}: FAIL {type(exc).__name__}: {str(exc)[:160]}")

          async def main():
              await probe("POOLED_6543", pooled)
              await probe("DIRECT_5432", direct)
              await probe("SESSION_5432", session)

          asyncio.run(main())
          PY

      - name: pg_dump schema-only proof (read-only, no prod writes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          PGD="${PG_BIN:-}"
          if [ -z "$PGD" ]; then
            PGD=$(command -v pg_dump || true)
          fi
          if [ -z "$PGD" ]; then
            echo "PROOF=skipped_no_pg_dump"
            exit 0
          fi
          SESSION_URL="${DATABASE_URL/:6543\//:5432/}"
          echo "::add-mask::$SESSION_URL"
          try_dump() {
            tag="$1"
            url="$2"
            if [ -z "$url" ]; then
              echo "$tag: EMPTY"
              return
            fi
            bytes=$(LD_LIBRARY_PATH="${PG_LIBDIR:-}" timeout 120 "$PGD" --schema-only --no-owner --no-privileges "$url" 2>"/tmp/dump_err_${tag}" | wc -c)
            if [ "${bytes:-0}" -gt 1000 ]; then
              echo "$tag: OK schema_bytes=$bytes"
            else
              err=$(head -c 200 "/tmp/dump_err_${tag}" 2>/dev/null | tr '\n' ' ')
              echo "$tag: FAIL ${err}"
            fi
          }
          try_dump DIRECT "${DIRECT_URL:-}"
          try_dump SESSION "$SESSION_URL"
