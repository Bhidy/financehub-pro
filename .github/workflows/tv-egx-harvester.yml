name: TradingView EGX Harvester

# Auxiliary TradingView cycles (technicals / news / estimates / symbol-map).
# prices cycle: writes today's forming OHLC candle to ohlc_data every 15 min during
# the session — this is the intraday chart-update path (backend handles market_tickers
# via EGX_PRIMARY_TV every 5 min; this adds the ohlc_data write).
# NOTE: requires repo secret DATABASE_URL. Disabled-by-default until that is set.

on:
  schedule:
    - cron: '*/15 6-13 * * 0-4'   # technicals + prices, market hours (UTC), Sun-Thu
    - cron: '45 11 * * 0-4'       # technicals post-close snapshot (EGX closes 11:30 UTC / 14:30 Cairo)
    - cron: '*/30 6-14 * * 0-4'   # news
    - cron: '0 15 * * 0-4'        # estimates, post-close
    - cron: '30 15 * * 0-4'       # dividends, post-close
    - cron: '0 2 * * 5'           # symbol-map + logos, weekly (Fri 02:00 UTC)
    - cron: '0 3 * * 5'           # financials (20yr) + fundamentals snapshot, weekly (Fri 03:00 UTC)
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Cycle to run'
        required: true
        default: 'technicals'
        type: choice
        options: [prices, technicals, news, estimates, dividends, symbolmap, financials, fundamentals, financials_and_fundamentals, all]

concurrency:
  group: tv-egx-harvester
  cancel-in-progress: false

jobs:
  qa-gate:
    # Resilience suite needs no DB - proves never-fail before any write job runs.
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install httpx asyncpg
      - name: Chaos / resilience audit (feed + write-path taxonomy, no DB)
        run: python qa/egx_audit.py --suite resilience
      - name: Write-contract preflight (schema-drift gate — needs DB)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python qa/egx_audit.py --suite contract

  harvest:
    needs: qa-gate
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install httpx asyncpg yfinance
      - name: Select cycle
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cycle=${{ github.event.inputs.cycle }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              # prices first: writes today's OHLC candle to ohlc_data (chart update).
              # Then technicals so both cycle in the same 15-min window.
              "*/15 6-13 * * 0-4") echo "cycle=prices_and_technicals" >> "$GITHUB_OUTPUT" ;;
              "45 11 * * 0-4")     echo "cycle=technicals" >> "$GITHUB_OUTPUT" ;;
              "*/30 6-14 * * 0-4") echo "cycle=news" >> "$GITHUB_OUTPUT" ;;
              "0 15 * * 0-4")      echo "cycle=estimates" >> "$GITHUB_OUTPUT" ;;
              "30 15 * * 0-4")     echo "cycle=dividends" >> "$GITHUB_OUTPUT" ;;
              "0 2 * * 5")         echo "cycle=symbolmap" >> "$GITHUB_OUTPUT" ;;
              "0 3 * * 5")         echo "cycle=financials_and_fundamentals" >> "$GITHUB_OUTPUT" ;;
              *)                   echo "cycle=technicals" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Run harvester
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/tv_egx_harvester.py --cycle "${{ steps.pick.outputs.cycle }}"
