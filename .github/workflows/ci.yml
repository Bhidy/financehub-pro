name: CI Guard

# ============================================================
# Prevention layer (created after the June 2026 freeze; upgraded 2026-06-11).
#
# RUNNER REALITY (verified 2026-06-11): GitHub-hosted runners are blocked on
# this account — jobs die in 2s with "recent account payments have failed or
# your spending limit needs to be increased". So CI runs on the self-hosted
# Hetzner runner.
#
# SECURITY (2026-08-15 audit): the premise this file previously relied on —
# "tolerable ONLY while the repo is private with a single trusted collaborator"
# — was FALSE. The repo was public (`gh repo view --json isPrivate` -> false),
# so any stranger could open a PR and execute code on the production box. A
# self-hosted runner is NOT ephemeral: it is the same machine that runs the
# backend and the scheduled NAV jobs that receive the DATABASE_URL secret.
# Note the risk was never "secrets leak into the fork's job" (they don't) — it
# was arbitrary code execution on a persistent host holding those secrets.
#
# Every job below is therefore gated on the PR originating from THIS repo.
# Fork PRs are skipped, not run — review them and re-run manually if needed.
# Do not remove that `if:` while any job here targets [self-hosted].
# If GitHub-hosted billing is ever restored, move runs-on back to
# ubuntu-latest and the guard becomes redundant (harmless to keep).
#
# Gates (every one verified locally-green before being added here):
#   1. actionlint     — every workflow file (caught the morning_brief.yml bug
#                       where a `secrets.*` ref in a step-level `if:` failed
#                       silently at 0s on every push for days)
#   2. compileall     — syntax across ingestion + backend + harvester scripts
#                       (no import, no network)
#   3. ruff E722      — bare `except:` ban (the swallowed-SystemExit class
#                       behind the silent ingestion failures); see ruff.toml
#   4. write-registry — every harvester write SQL must be registered in
#                       ALL_WRITE_SQL so the QA write-contract gate covers it
#                       (scripts/check_write_registry.py)
#   5. pytest         — offline data-layer tests (feed dedup / price validation
#                       / router fallback); network is monkeypatched
#   6. tsc --noEmit   — frontend type integrity (strict TS, lockfile-exact)
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflows:
    name: Validate workflows (actionlint)
    # SECURITY GATE (2026-08-15): this job runs on the self-hosted prod box.
    # Never let code from a FORK execute here. Same-repo PRs and pushes only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        env:
          # Keep CI focused on real problems: report shellcheck warnings+errors
          # but drop info/style noise (e.g. SC2086 word-splitting on $GITHUB_OUTPUT).
          # actionlint's own checks (incl. `secrets` in step-level `if:`) still fail.
          SHELLCHECK_OPTS: -S warning
        run: |
          # Pinned official installer (supply-chain: pin the script to a release tag)
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  python-gates:
    name: Python gates (syntax · lint · write-registry · tests)
    # SECURITY GATE (2026-08-15): this job runs on the self-hosted prod box.
    # Never let code from a FORK execute here. Same-repo PRs and pushes only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile backend + ingestion + harvester scripts (syntax only)
        run: |
          python -m compileall -q \
            -x '(__pycache__|\.venv)' \
            ingestion \
            scripts \
            backend-core/app \
            backend-core/data_pipeline \
            backend-core/scripts
          echo "✅ Python sources compile cleanly"
      - name: Install gate dependencies
        # pytest-asyncio: the data-layer tests carry explicit @pytest.mark.asyncio
        # markers — without the plugin every async test fails as "not natively
        # supported" (first live CI run proved it).
        run: pip install --quiet ruff pytest pytest-asyncio httpx
      - name: Ruff — bare `except:` ban (E722, see ruff.toml)
        run: ruff check .
      - name: Write-registry gate (harvester SQL must be QA-covered)
        run: python scripts/check_write_registry.py
      - name: Offline data-layer tests
        env:
          # config.py fail-fasts on a missing SECRET_KEY by design; give tests a
          # dummy so importing app.* in future tests never breaks CI mysteriously.
          SECRET_KEY: ci-only-dummy-not-used-in-prod
        run: |
          cd backend-core
          python -m pytest tests/ -q

  qa-write-contract:
    name: QA write-contract (live schema dry-run)
    # Dry-runs every registered write SQL against the LIVE schema inside a
    # rolled-back transaction (qa/egx_audit.py suite_write_contract). This is
    # the gate that caught PR #86's 17-vs-19-argument drift — but only AFTER
    # merge, inside the harvester run. Running it per-PR means contract drift
    # can never reach main. Same-repo PRs only — enforced by the `if:` guard
    # below, not by an assumption about repo visibility.
    # SECURITY GATE (2026-08-15): this job runs on the self-hosted prod box.
    # Never let code from a FORK execute here. Same-repo PRs and pushes only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet asyncpg httpx
      - name: Write-contract dry-run against live schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python qa/egx_audit.py --suite contract

  frontend-build:
    name: Frontend production build (mirrors Vercel exactly)
    # SECURITY GATE (2026-08-15): this job runs on the self-hosted prod box.
    # Never let code from a FORK execute here. Same-repo PRs and pushes only.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies — VERCEL'S EXACT COMMAND
        working-directory: frontend
        # CRITICAL (2026-06-12): this job used to run `tsc --noEmit` only, which is
        # WHY a green CI coexisted with a FAILED Vercel build — tsc cannot catch a
        # build-time module-resolution error. recharts declares react-is as a PEER
        # dep; Vercel installs with `npm install --legacy-peer-deps` (which SKIPS
        # peers), so react-is was absent and the Turbopack build failed with
        # "Can't resolve 'react-is'". `npm ci` (what CI used) auto-installs peers,
        # hiding the failure. The ONLY way to guarantee CI green ⇒ Vercel green is
        # to install AND build with Vercel's exact commands. Do not "optimize" this
        # back to npm ci or tsc-only — that reintroduces the false-confidence gap.
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Production build (next build — type-checks AND resolves every module)
        working-directory: frontend
        run: npm run build
