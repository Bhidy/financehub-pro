name: Enterprise Data Update System

on:
  schedule:
    # PRICES: Every 5 min during market hours (6-13 UTC = 9-16 Saudi/Cairo)
    - cron: '*/5 6-13 * * 0-4'
    
    # DAILY SYNC: 6 PM Saudi (15:00 UTC)
    - cron: '0 15 * * 0-4'
    
    # EGYPT FUNDS: 7 PM Saudi (16:00 UTC)
    - cron: '0 16 * * 0-4'
    
    # AI INGESTION: 8 PM Saudi (17:00 UTC)
    - cron: '0 17 * * 0-4'
    
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job to Run'
        required: true
        default: 'prices'
        type: choice
        options:
          - prices
          - daily
          - egypt-funds
          - ingestion
          - backfill

# CRITICAL: This workflow must be pushed to GitHub to take effect!
env:
  FINHUB_API_BASE: https://starta.46-224-223-172.sslip.io/api/v1/admin

# Serialize all runs of this workflow. The 5-min price cron and the long daily/
# funds/ingestion jobs share ONE backend refresh lock; overlapping runs were the
# cause of the 50m/58m poll-timeout failures. Queue instead of colliding.
concurrency:
  group: enterprise-data-update
  cancel-in-progress: false

jobs:
  # ============================================================
  # UNIFIED WATCHDOG - Single Job, All Updates via Backend API
  # ============================================================
  watchdog:
    name: 🐕 Enterprise Watchdog
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 60
    
    steps:
      - name: 🚀 Start Watchdog
        run: echo "Enterprise Watchdog starting at $(date)"

      - name: Ensure jq (self-installing, no sudo)
        # The self-hosted runner has NO passwordless sudo, so `sudo apt-get install`
        # used to fail 100% of runs here. Install a static jq into ~/.local/bin
        # (no root, no apt) ONLY if missing and reuse it after — it can never fail
        # on tooling, and the later jq calls can never silently fake success.
        run: |
          if command -v jq >/dev/null 2>&1; then echo "jq present: $(jq --version)"; exit 0; fi
          if [ -x "$HOME/.local/bin/jq" ]; then echo "$HOME/.local/bin" >> "$GITHUB_PATH"; echo "jq cached"; exit 0; fi
          echo "jq missing — installing static binary to ~/.local/bin (no sudo)"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 -o "$HOME/.local/bin/jq"
          chmod +x "$HOME/.local/bin/jq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jq" --version

      # ============================================================
      # JOB 1: PRICE REFRESH (Every 5 min during market hours)
      # ============================================================
      - name: 📈 Price Refresh
        if: |
          (github.event_name == 'schedule' && contains(github.event.schedule, '*/5')) ||
          (github.event.inputs.job_type == 'prices')
        run: |
          ENDPOINT="/refresh/prices"
          echo "🚀 Triggering Price Refresh..."
          RESPONSE=$(curl -s -X POST "${{ env.FINHUB_API_BASE }}$ENDPOINT" -H "Content-Type: application/json" --max-time 30)
          echo "Trigger Response: $RESPONSE"

          # Start Polling
          echo "⏳ Polling for completion..."
          START_TIME=$(date +%s)
          while true; do
            STATUS_JSON=$(curl -s "${{ env.FINHUB_API_BASE }}/refresh/status")
            IS_RUNNING=$(echo "$STATUS_JSON" | jq -r '.is_running')
            LAST_STATUS=$(echo "$STATUS_JSON" | jq -r '.last_status')
            UPDATED=$(echo "$STATUS_JSON" | jq -r '.tickers_updated')

            echo "Status: $LAST_STATUS | Running: $IS_RUNNING | Updated: $UPDATED"

            if [ "$IS_RUNNING" == "false" ]; then
              echo "Job finished. last_status=$LAST_STATUS | tickers_updated=$UPDATED"
              # A backend-side error is the only hard failure here.
              case "$LAST_STATUS" in
                *error*|*FAILED*|*failed*)
                  echo "::error::Price refresh errored (status=$LAST_STATUS). Errors: $(echo "$STATUS_JSON" | jq -c '.errors')"
                  exit 1;;
              esac
              if [ "${UPDATED:-0}" -gt 0 ] 2>/dev/null; then
                echo "✅ Price refresh updated $UPDATED tickers"
              else
                # 0 updates is suspicious but usually transient (one bad screener
                # cycle). Stay NON-FATAL here on purpose: hard-failing every 5 min on a
                # single empty cycle was the old false-red. A SUSTAINED 0 (prices truly
                # frozen) is escalated independently, defense-in-depth:
                #   - L1 on-box Data Freshness Monitor (Hetzner runner), and
                #   - L2 OFF-box freshness route (Vercel→Supabase) polled by UptimeRobot,
                #     which still fires even if this whole runner/box is down.
                # So we WARN loudly (visible amber) but never page every 5 minutes here.
                echo "::warning::Price refresh updated 0 tickers (status=$LAST_STATUS). NON-FATAL — L1 freshness monitor + L2 off-box freshness route escalate if prices stay frozen."
              fi
              break
            fi
            sleep 5
            # Still running at the cap: backend continues in the background; do NOT
            # mark the run failed (that was the recurring false-red alert).
            if [ $(($(date +%s) - START_TIME)) -gt 240 ]; then
              echo "::warning::Price refresh still running after 240s ($LAST_STATUS). Backend continues; not failing the run."
              break
            fi
          done

      # ============================================================
      # JOB 2: DAILY SYNC (6 PM Saudi - OHLC + Financials)
      # ============================================================
      - name: 📊 Daily EOD Sync
        if: |
          (github.event_name == 'schedule' && contains(github.event.schedule, '0 15')) ||
          (github.event.inputs.job_type == 'daily')
        run: |
          ENDPOINT="/refresh/daily"
          echo "🚀 Triggering Daily Sync..."
          curl -s -X POST "${{ env.FINHUB_API_BASE }}$ENDPOINT" -H "Content-Type: application/json" --max-time 30
          
          # Start Polling
          echo "⏳ Polling for completion..."
          START_TIME=$(date +%s)
          while true; do
            STATUS_JSON=$(curl -s "${{ env.FINHUB_API_BASE }}/refresh/status")
            IS_RUNNING=$(echo "$STATUS_JSON" | jq -r '.is_running')
            LAST_STATUS=$(echo "$STATUS_JSON" | jq -r '.last_status')

            echo "Status: $LAST_STATUS"

            if [ "$IS_RUNNING" == "false" ]; then
              case "$LAST_STATUS" in
                *error*|*FAILED*|*failed*) echo "::error::Daily Sync errored: $LAST_STATUS"; exit 1;;
                *) echo "✅ Daily Sync Completed! ($LAST_STATUS)"; break;;
              esac
            fi
            sleep 10
            # Daily EOD legitimately runs 50+ min; if it's still progressing at the
            # cap, the backend finishes on its own — don't false-fail the run.
            if [ $(($(date +%s) - START_TIME)) -gt 3000 ]; then
              echo "::warning::Daily Sync still running after 3000s ($LAST_STATUS). Backend continues; not failing the run."
              break
            fi
          done

      # ============================================================
      # JOB 3: EGYPT FUNDS (7 PM Saudi)
      # ============================================================
      - name: 💰 Egypt Funds Sync
        if: |
          (github.event_name == 'schedule' && contains(github.event.schedule, '0 16')) ||
          (github.event.inputs.job_type == 'egypt-funds')
        run: |
          ENDPOINT="/refresh/egypt-funds"
          echo "🚀 Triggering Egypt Funds..."
          curl -s -X POST "${{ env.FINHUB_API_BASE }}$ENDPOINT" -H "Content-Type: application/json" --max-time 30
          
          # Poll
          START_TIME=$(date +%s)
          while true; do
            STATUS_JSON=$(curl -s "${{ env.FINHUB_API_BASE }}/refresh/status")
            IS_RUNNING=$(echo "$STATUS_JSON" | jq -r '.is_running')
            LAST_STATUS=$(echo "$STATUS_JSON" | jq -r '.last_status')
            echo "Running: $IS_RUNNING | Status: $LAST_STATUS"
            if [ "$IS_RUNNING" == "false" ]; then
              case "$LAST_STATUS" in
                *error*|*FAILED*|*failed*) echo "::error::Egypt Funds errored: $LAST_STATUS"; exit 1;;
                *) echo "✅ Egypt Funds Done ($LAST_STATUS)"; break;;
              esac
            fi
            sleep 10
            # tls_client NAV scrape can be slow/Cloudflare-throttled; if still running
            # at the cap the backend finishes on its own — don't false-fail.
            if [ $(($(date +%s) - START_TIME)) -gt 600 ]; then
              echo "::warning::Egypt Funds still running after 600s ($LAST_STATUS). Backend continues; not failing the run."
              break
            fi
          done

      # ============================================================
      # JOB 4: AI INGESTION (8 PM Saudi)
      # ============================================================
      - name: 🤖 AI Knowledge Ingestion
        if: |
          (github.event_name == 'schedule' && contains(github.event.schedule, '0 17')) ||
          (github.event.inputs.job_type == 'ingestion')
        run: |
          ENDPOINT="/refresh/ingestion"
          echo "🚀 Triggering AI Ingestion..."
          curl -s -X POST "${{ env.FINHUB_API_BASE }}$ENDPOINT" -H "Content-Type: application/json" --max-time 30
          
          # Poll - This is the long one!
          echo "⏳ Polling for completion (May take 30 mins)..."
          START_TIME=$(date +%s)
          while true; do
            STATUS_JSON=$(curl -s "${{ env.FINHUB_API_BASE }}/refresh/status")
            IS_RUNNING=$(echo "$STATUS_JSON" | jq -r '.is_running')
            LAST_STATUS=$(echo "$STATUS_JSON" | jq -r '.last_status')

            echo "Status: $LAST_STATUS"

            if [ "$IS_RUNNING" == "false" ]; then
              case "$LAST_STATUS" in
                *error*|*FAILED*|*failed*) echo "::error::AI Ingestion errored: $LAST_STATUS"; exit 1;;
                *) echo "✅ AI Ingestion Completed! ($LAST_STATUS)"; break;;
              esac
            fi
            sleep 10
            if [ $(($(date +%s) - START_TIME)) -gt 3500 ]; then
              echo "::warning::AI Ingestion still running after 3500s ($LAST_STATUS). Backend continues; not failing the run."
              break
            fi
          done

      # ============================================================
      # JOB 5: BACKFILL (Manual Only)
      # ============================================================
      - name: 📚 Historical Backfill
        if: github.event.inputs.job_type == 'backfill'
        run: |
          echo "Triggering Backfill..."
          curl -s -X POST "${{ env.FINHUB_API_BASE }}/refresh/backfill" -H "Content-Type: application/json"
          echo "Polling..."
          START_TIME=$(date +%s)
          while true; do
            STATUS_JSON=$(curl -s "${{ env.FINHUB_API_BASE }}/refresh/status")
            IS_RUNNING=$(echo "$STATUS_JSON" | jq -r '.is_running')
            LAST_STATUS=$(echo "$STATUS_JSON" | jq -r '.last_status')
            echo "$LAST_STATUS"
            if [ "$IS_RUNNING" == "false" ]; then
              case "$LAST_STATUS" in
                *error*|*FAILED*|*failed*) echo "::error::Backfill errored: $LAST_STATUS"; exit 1;;
                *) echo "✅ Backfill Done ($LAST_STATUS)"; break;;
              esac
            fi
            sleep 10
            if [ $(($(date +%s) - START_TIME)) -gt 3500 ]; then
              echo "::warning::Backfill still running after 3500s ($LAST_STATUS). Backend continues; not failing the run."
              break
            fi
          done

      # ============================================================
      # ALERTING SYSTEM
      # ============================================================
      - name: ✅ Discord Success Alert
        if: success()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"content": "✅ **FinanceHub Watchdog**: Auto-update cycle completed successfully at '"$(date)"'"}'
          
      - name: 🚨 Discord Failure Alert
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"content": "🚨 **CRITICAL**: FinanceHub Watchdog FAILED!\n**Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
