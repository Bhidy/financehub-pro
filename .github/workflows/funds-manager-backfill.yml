name: Funds Manager Backfill

# ============================================================
# Recovers NAV history for the funds EIMA does not cover, from the people who
# published it: the managers, and the vendor's own newsroom.
#
# WHY THIS EXISTS
# After the EIMA recovery, fourteen funds still carried the full 412-day hole
# (2025-05-14 → 2026-06-30) that Mubasher's frozen per-fund CSV opened. EIMA's
# weekly report covers mainstream Egyptian-pound retail funds; every one of the
# fourteen is a foreign-currency, charitable or specialised-issuance fund. That
# was tested, not assumed — re-running the EIMA matcher at a third of its name
# floor returned the same fourteen.
#
# SOURCES
#   azimut         app.azimut.eg/api/fund/{id} → `graph`, the full
#                  [epoch_ms, nav] series behind the "Growth of Investment"
#                  chart on azimut.eg. Recovered 4,672 observations across 13
#                  funds on its first run. Reads floats from a JSON API and
#                  never touches markup.
#
#   mubasher_news  THE VENDOR HAD THE DATA THE WHOLE TIME. Mubasher's per-fund
#                  price FILE froze on 2025-05-14; their news desk went on
#                  publishing "Prices of investment funds including certificates
#                  in EGP, USD" throughout — every fund, its unit price, and an
#                  explicit as-of date. Different system, same publisher. The
#                  live article is behind a sign-in wall; the Internet Archive
#                  holds 114 of them, 112 captured inside the hole.
#
#   cicapital      cicapital.com/fundprice/ publishes one table of unit prices
#                  and overwrites it daily; the archive holds captures of it.
#                  Kept because it costs little and becomes useful the moment
#                  the archive gains a capture outside the hole.
#
# MAPPING IS DECIDED BY DATA, NEVER BY A NAME. A series is attached to a fund
# only when it agrees with NAV we already hold. Two forms of proof are accepted:
# a dense overlap with a tight median, or ONE uncontradicted six-figure match —
# on 2025-04-06 Mubasher's table agrees with our stored NAV to 0.000% for every
# fund that later went dark, and the five CI siblings carry different values, so
# a swap between them shows immediately. The same rule rejected Azimut's
# "Menthum" against our fund 6157 at 41% error, and separates Maksab USD (our
# 6121, 0.004%) from our 6193 (4.567%).
#
# REPAIR MODE. A price rendered as `19.<span>40456</span>` was once read as
# "19." and written as 19.0 — a wrong NAV on a live page, not a missing one. The
# parser now reads the number whole and refuses anything still ending in a
# separator, but the rows already written had to come out. `purge` deletes rows
# by source and is restricted to the three sources this script writes: no vendor
# observation and no other pipeline's row can be reached from it. Everything it
# removes is re-derivable by a subsequent write.
#
# BE KIND: self-identifying UA, a delay between requests, one pass over each
# archived article. The Internet Archive is a public service; Azimut's API is
# the one their own public site calls.
#
# Requires repo secret DATABASE_URL.
# ============================================================

on:
  schedule:
    # Fridays 07:30 UTC — after the EIMA backfill (06:00) and before the NAV
    # archive (11:00), so a week's recovery from both lands in one snapshot.
    - cron: '30 7 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'write commits what reconciles (also the scheduled mode); dry-run reports only; purge deletes this script own rows for the chosen source'
        required: true
        default: 'write'
        type: choice
        options: [write, dry-run, purge]
      source:
        description: 'restrict to one source (blank = all; required for purge)'
        required: false
        default: ''
        type: choice
        options: ['', azimut, mubasher_news, cicapital]

concurrency:
  group: funds-manager-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill NAV history from fund managers
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet httpx asyncpg

      - name: Run manager backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode }}"
          SRC="${{ github.event.inputs.source }}"
          ARGS=""
          [ -n "$SRC" ] && ARGS="--only $SRC"
          case "$MODE" in
            purge)
              case "$SRC" in
                azimut)        PS=azimut_site ;;
                mubasher_news) PS=mubasher_news_archive ;;
                cicapital)     PS=cicapital_site ;;
                *) echo "purge needs an explicit source" >&2; exit 1 ;;
              esac
              python backend-core/scripts/manager_nav_backfill.py --purge-source "$PS" ;;
            dry-run)
              python backend-core/scripts/manager_nav_backfill.py --dry-run $ARGS ;;
            write|'')
              python backend-core/scripts/manager_nav_backfill.py $ARGS ;;
            *)
              echo "unknown mode: $MODE" >&2; exit 1 ;;
          esac
