name: Funds Freshness Monitor

# ============================================================
# The alarm that was MISSING during the funds freeze: data-freshness-monitor.yml
# watches PRICES only, so mutual-fund NAVs rotted for weeks (most funds 2026-05-20
# or older; a cohort frozen at 2026-01-07) while every check stayed green.
#
# This watches FUND DATA freshness directly in Supabase (no backend dependency):
#   * newest fund NAV across numeric ids must be recent (daily money-market funds
#     publish every business day) — alert if older than 5 days
#   * a healthy baseline keeps ~80-110 funds fresh within 10 days — alert if it
#     collapses below 30
#
# Signal contract (2026-06-11): stale DATA FAILS the run (exit 2) — the red run's
# GitHub mobile push IS the page (Discord no longer exists). Thresholds are
# wall-day scale (5d NAV age / fresh-cohort collapse), so weekends and holidays
# cannot false-page. Requires repo secret DATABASE_URL.
# ============================================================

on:
  schedule:
    # Daily after each scheduled update window, Sun-Thu
    - cron: '0 7 * * 0-4'    # ~10:00 Cairo (after the 08:00 update)
    - cron: '0 18 * * 0-4'   # ~21:00 Cairo (after the 19:00 update)
  workflow_dispatch:

concurrency:
  group: funds-freshness-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: Check fund NAV freshness
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install asyncpg

      - name: Probe fund freshness
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend-core/scripts/funds_nav_updater.py --monitor --stale-days 5
