name: Production Watchdog

on:
  schedule:
    # Run every 6 hours (Check 4 times a day)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  health-check:
    runs-on: [self-hosted, linux, x64, hetzner]
    steps:
      - name: Check FinanceHub API Health
        # CRITICAL: Push to GitHub to update the URL in GitHub Actions
        id: health_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://starta.46-224-223-172.sslip.io/health)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::API is DOWN (Status: $STATUS)"
            exit 1
          fi
            echo "API is Healthy ✅"

      - name: Notify Discord on Failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"content": "🚨 **CRITICAL ALERT**\nFinanceHub API is DOWN!\nURL: https://starta.46-224-223-172.sslip.io\nCheck Hetzner VPS immediately."}'
