name: Stocks Freshness Monitor

# Completeness + chart-freshness alarm for EGX stocks, complementing
# data-freshness-monitor.yml (which watches live PRICE age). This watches that
# every ticker has a price AND that the EOD ohlc_data charts are fresh + complete,
# reading Supabase directly (no backend dependency).
#
# Signal contract (2026-06-11): stale/incomplete DATA FAILS the run (exit 2) — the
# red run's GitHub mobile push IS the page (Discord no longer exists). Thresholds
# are day-scale (24h price age, 5d ohlc age, completeness ratios) — weekend-safe.
# Requires DATABASE_URL.

on:
  schedule:
    - cron: '0 8 * * 0-4'    # ~11:00 Cairo (after morning price updates)
    - cron: '0 18 * * 0-4'   # ~21:00 Cairo (after EOD)
  workflow_dispatch:

concurrency:
  group: stocks-freshness-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: Check stock data freshness
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install asyncpg

      - name: Probe stock freshness
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend-core/scripts/reconcile_stocks_source.py --monitor
