name: Notify Selftest (temporary)

# TEMPORARY: verify scripts/notify.py's email path with the NEW SMTP_PASSWORD
# app password (set 2026-06-12). The step never fails (|| true): the JSON status
# in the log is the evidence. Removed once delivery is confirmed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: exercise email channel (read-only)
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send test alert via notify.py
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 scripts/notify.py "Starta alert self-test ✅" "Email alert channel verification from hetzner-prod (2026-06-12). If you received this, the second alert channel is live." || true
