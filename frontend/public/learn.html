<!DOCTYPE html>
<html lang="en" class="scroll-smooth" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn | Starta Markets</title>
    <meta name="description" content="Starta Learn helps new investors understand mutual funds and the stock market with premium beginner-friendly guides in Arabic and English.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="/data/learn-topics.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        page: 'var(--c-page)',
                        surface: 'var(--c-surface)',
                        panel: 'var(--c-panel)',
                        main: 'var(--c-text-main)',
                        muted: 'var(--c-text-muted)',
                        border: 'var(--c-border)',
                        starta: { teal: '#14B8A6', darkTeal: '#0F766E' }
                    },
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        display: ['Sora', 'sans-serif'],
                        arabic: ['IBM Plex Sans Arabic', 'sans-serif'],
                    },
                    boxShadow: {
                        premium: 'var(--shadow-premium)',
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --c-page: #f4f7fb;
            --c-surface: #ffffff;
            --c-panel: rgba(255, 255, 255, 0.88);
            --c-text-main: #0f172a;
            --c-text-muted: #5b6677;
            --c-border: rgba(148, 163, 184, 0.18);
            --shadow-premium: 0 24px 60px rgba(148, 163, 184, 0.16);
        }

        html[dir="rtl"] body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
        html[dir="rtl"] .font-display { font-family: 'IBM Plex Sans Arabic', sans-serif; }
        body { background: var(--c-page); color: var(--c-text-main); font-family: 'Manrope', sans-serif; overflow-x: hidden; }
        .glass-premium { background: rgba(255,255,255,0.84); backdrop-filter: blur(22px); border: 1px solid rgba(148,163,184,0.18); box-shadow: var(--shadow-premium); }
        .topic-card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(255,255,255,0.99), rgba(247,250,253,0.97));
            border: 1px solid rgba(148,163,184,0.18);
            box-shadow: 0 22px 54px rgba(148,163,184,0.12);
            transition: transform 260ms ease, box-shadow 260ms ease, border-color 260ms ease;
        }
        .topic-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 34px 72px rgba(20,184,166,0.14);
            border-color: rgba(20,184,166,0.24);
        }
        .cover-art {
            position: relative;
            overflow: hidden;
            min-height: 19rem;
            isolation: isolate;
            border: 1px solid rgba(255,255,255,0.65);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
        }
        .cover-art::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at top left, rgba(255,255,255,0.82), transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.72) 74%, rgba(255,255,255,0.94) 100%);
        }
        .cover-art::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--topic-accent) 14%, white), rgba(255,255,255,0.08)),
                radial-gradient(circle at 80% 14%, color-mix(in srgb, var(--topic-accent) 22%, white), transparent 24%);
            mix-blend-mode: multiply;
            opacity: 0.95;
        }
        .cover-art.has-image {
            min-height: 0;
            aspect-ratio: 4 / 3;
            padding: 0;
            background: #fff;
            border-color: rgba(148, 163, 184, 0.12);
            box-shadow:
                0 18px 38px rgba(15, 23, 42, 0.06),
                inset 0 1px 0 rgba(255,255,255,0.92);
        }
        .cover-art.has-image::before,
        .cover-art.has-image::after {
            display: none;
        }
        .cover-art-image {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }
        .cover-art-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 4.9rem;
            height: 4.9rem;
            padding: 0 1rem;
            border-radius: 1.4rem;
            background: rgba(255,255,255,0.68);
            backdrop-filter: blur(14px);
            box-shadow: 0 14px 32px rgba(148,163,184,0.14);
        }
        .cover-art-title {
            text-shadow: 0 8px 24px rgba(255,255,255,0.6);
            text-wrap: balance;
        }
        .cover-art-footer {
            position: relative;
            z-index: 1;
            margin-top: auto;
            padding-top: 4.25rem;
        }
        .nav-pill { border: 1px solid rgba(148,163,184,0.16); background: rgba(255,255,255,0.88); color: var(--c-text-main); }
        .hero-copy { text-wrap: balance; }
        .topic-summary { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>

<body>
    <div class="fixed inset-0 z-[-2] pointer-events-none opacity-80" style="background-image: linear-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 184, 166, 0.04) 1px, transparent 1px); background-size: 42px 42px;"></div>
    <div class="fixed inset-0 z-[-1] pointer-events-none" style="background: radial-gradient(circle at top left, rgba(20, 184, 166, 0.16), transparent 28%), radial-gradient(circle at top right, rgba(45, 212, 191, 0.08), transparent 24%);"></div>

    <nav class="fixed top-0 w-full z-50 border-b border-border bg-page/80 backdrop-blur-xl">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-8 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='/'">
                <div class="w-8 h-8 bg-starta-teal rounded-lg flex items-center justify-center font-bold text-white text-xl font-display">S</div>
                <span class="text-lg font-display font-bold text-main tracking-widest">STARTA</span>
            </div>
            <div class="hidden lg:flex items-center gap-10">
                <div class="flex gap-10 text-xs font-mono text-muted tracking-widest uppercase">
                    <a href="/#brain" class="hover:text-starta-teal transition-colors" data-key="nav_features">FEATURES</a>
                    <a href="/Funds" class="hover:text-starta-teal transition-colors" data-key="nav_mobile">MUTUAL FUNDS</a>
                    <a href="/Market-Pulse" class="hover:text-starta-teal transition-colors" data-key="nav_pulse">MARKET PULSE</a>
                    <a href="/Learn" class="hover:text-starta-teal transition-colors text-starta-darkTeal" data-key="nav_learn">LEARN</a>
                    <a href="/News" class="hover:text-starta-teal transition-colors" data-key="nav_news">NEWS</a>
                    <a href="/#about" class="hover:text-starta-teal transition-colors" data-key="nav_about">ABOUT US</a>
                    <a href="/#pricing" class="hover:text-starta-teal transition-colors" data-key="nav_pricing">PRICING</a>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="langToggle" class="nav-pill rounded-full px-4 py-2 text-sm font-display font-semibold">AR</button>
            </div>
        </div>
    </nav>

    <main class="pt-28 pb-20 min-h-screen">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-8">
            <section class="glass-premium rounded-[2.8rem] p-7 sm:p-10 lg:p-14 reveal-block">
                <div class="max-w-[62rem]">
                    <div class="text-[0.72rem] font-semibold uppercase tracking-[0.24em] text-starta-darkTeal" data-key="hero_tag">Starta Learn</div>
                    <h1 class="hero-copy mt-4 text-[2.25rem] leading-[1.12] sm:text-[2.8rem] lg:text-[3.35rem] font-display font-bold tracking-[-0.05em] text-main" data-key="hero_title"><span class="block">Starta Academy: Build Your</span><span class="block">Investing Confidence</span></h1>
                    <p class="hero-copy mt-6 max-w-3xl text-base leading-relaxed sm:text-lg lg:text-xl text-muted" data-key="hero_text">Clear beginner lessons covering markets, mutual funds, risk, and portfolio basics.</p>
                </div>
            </section>

            <section class="mt-8 reveal-block">
                <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3" id="topicsGrid"></div>
            </section>
        </div>
    </main>

    <script>
        gsap.registerPlugin(ScrollTrigger);
        const translations = {
            en: {
                nav_features: "FEATURES", nav_learn: "LEARN", nav_mobile: "MUTUAL FUNDS", nav_pulse: "MARKET PULSE", nav_news: "NEWS", nav_about: "ABOUT US", nav_pricing: "PRICING",
                hero_tag: "Starta Learn", hero_title: '<span class="block">Starta Academy: Build Your</span><span class="block">Investing Confidence</span>', hero_text: "Clear beginner lessons covering markets, mutual funds, risk, and portfolio basics.", open_topic: "Open topic"
            },
            ar: {
                nav_features: "المزايا", nav_learn: "تعلّم", nav_mobile: "الصناديق الاستثمارية", nav_pulse: "نبض السوق", nav_news: "الأخبار", nav_about: "معلومات عنا", nav_pricing: "الأسعار",
                hero_tag: "أكاديمية ستارتا", hero_title: '<span class="block">أكاديمية ستارتا: ابنِ ثقتك</span><span class="block">في الاستثمار</span>', hero_text: "دروس واضحة للمبتدئين تغطي الأسواق والصناديق الاستثمارية والمخاطر وأساسيات المحفظة.", open_topic: "افتح الموضوع"
            }
        };
        const state = { lang: 'en' };
        const topics = window.STARTA_LEARN_TOPICS || [];

        function getStoredLanguage() {
            const stored = localStorage.getItem('starta-lang') || localStorage.getItem('lang');
            return stored === 'ar' ? 'ar' : 'en';
        }

        function setLanguage(lang) {
            state.lang = lang === 'ar' ? 'ar' : 'en';
            localStorage.setItem('starta-lang', state.lang);
            localStorage.setItem('lang', state.lang);
            document.documentElement.lang = state.lang;
            document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langToggle').textContent = state.lang === 'ar' ? 'EN' : 'AR';
            document.querySelectorAll('[data-key]').forEach((el) => {
                const key = el.getAttribute('data-key');
                if (translations[state.lang][key]) el.innerHTML = translations[state.lang][key];
            });
            renderTopics();
        }

        function renderTopics() {
            const labels = translations[state.lang];
            const grid = document.getElementById('topicsGrid');
            grid.innerHTML = topics.map((topic) => {
                const content = topic[state.lang];
                const activeCover = state.lang === 'ar'
                    ? (topic.coverImageAr || '')
                    : (topic.coverImageEn || '');
                const hasCover = Boolean(activeCover);
                const coverVisual = hasCover ? `
                    <div class="cover-art has-image rounded-[1.7rem]" style="--topic-accent:${topic.accent};">
                        <img class="cover-art-image" src="${activeCover}" alt="${content.title}" loading="lazy">
                    </div>
                ` : `
                    <div class="cover-art rounded-[1.7rem] p-6 text-main" style="--topic-accent:${topic.accent};">
                        <div class="relative z-[1] flex items-start justify-between gap-5">
                            <div class="text-[0.72rem] font-semibold uppercase tracking-[0.22em]" style="color:${topic.accent}">${content.category}</div>
                            <div class="rounded-full border border-white/70 bg-white/70 px-3 py-1 text-xs font-bold text-slate-700">${content.readTime}</div>
                        </div>
                        <div class="cover-art-footer">
                            <div class="flex items-end justify-between gap-4">
                                <div class="cover-art-chip text-4xl font-display font-bold tracking-[-0.05em] text-main">${topic.icon}</div>
                                <div class="max-w-[14rem] rounded-full border border-white/75 bg-white/72 px-3 py-1.5 text-[0.68rem] font-semibold uppercase tracking-[0.16em] text-slate-600">
                                    ${content.category}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                return `
                    <article class="topic-card rounded-[2.2rem] p-5 sm:p-6">
                        ${coverVisual}
                        <div class="mt-5">
                            <h2 class="text-2xl font-display font-bold tracking-[-0.04em] text-main cover-art-title">${content.title}</h2>
                            <p class="topic-summary mt-3 text-sm leading-7 text-muted">${content.summary}</p>
                            <a href="/Learn/${topic.slug}" class="mt-5 inline-flex items-center gap-2 rounded-full bg-starta-teal px-4 py-2 text-sm font-semibold text-white">${labels.open_topic} <span>→</span></a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function revealSections() {
            document.querySelectorAll('.reveal-block').forEach((element) => {
                gsap.fromTo(element, { y: 24, opacity: 0 }, {
                    y: 0, opacity: 1, duration: 0.8, ease: 'power3.out',
                    scrollTrigger: { trigger: element, start: 'top 88%' }
                });
            });
        }

        document.getElementById('langToggle').addEventListener('click', () => setLanguage(state.lang === 'en' ? 'ar' : 'en'));
        setLanguage(getStoredLanguage());
        revealSections();
    </script>
</body>

</html>
