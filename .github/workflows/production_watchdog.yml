name: Production Watchdog

# NOTE: This job only checks /health LIVENESS (is the API process up). It is NOT a
# data-freshness signal. For REAL data freshness (prices/charts/news/funds SLAs)
# rely on the OFF-box L2 route GET /api/v1/health/freshness
# (https://startamarkets.com/api/v1/health/freshness — Vercel -> Supabase, zero
# Hetzner dependency; 503 + "DATA_STALE" when a critical feed is stale), polled
# every ~5 min by the external uptime monitor (UptimeRobot). Do NOT raise this
# cron's frequency to compensate — it adds self-hosted runner load.
on:
  schedule:
    # Run every 6 hours (Check 4 times a day)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  health-check:
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 10
    steps:
      - name: Check FinanceHub API Health
        # CRITICAL: Push to GitHub to update the URL in GitHub Actions
        id: health_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://starta.46-224-223-172.sslip.io/health)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::API is DOWN (Status: $STATUS)"
            exit 1
          fi
            echo "API is Healthy ✅"
