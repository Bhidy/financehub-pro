name: Enterprise Data Reservoir Sync

on:
  schedule:
    # Every 4h at :30 — same cadence (watchdog interval-SLA is 6h) but OFF the
    # :00 cluster: 16:00 UTC used to stack this with funds/stats/reconcile on the
    # single runner. 13:30 lands right after EGX close (11:30 UTC) for EOD bars.
    - cron: '30 1,5,9,13,17,21 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: data-reservoir-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write               # notify.py last-resort channel: alert → GitHub issue

jobs:
  fill-reservoir:
    name: "Ingest Deep Financial Data"
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 60

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: Install Enterprise Dependencies
        run: |
          pip install --upgrade pip
          # curl_cffi enables the reservoir's Chrome-impersonation session (anti-block);
          # without it the script logs "High Risk of Block" and falls back to plain requests.
          pip install yfinance asyncpg pandas requests beautifulsoup4 httpx python-dotenv curl_cffi

      - name: Run Primary Ingestion (Yahoo Finance)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ingestion/populate_yahoo_reservoir.py

      # Watch the watchman: independently verify the Pipeline Watchdog itself is
      # still running — a stale heartbeat FAILS this step (red run = GitHub mobile
      # page). This + the watchdog watching data_sync = mutual dead-man's-switch.
      #
      # THRESHOLD CONTRACT (do not lower without changing the watchdog crons):
      # the watchdog's designed max schedule gap is 2h (see pipeline-watchdog.yml);
      # 150 = 120 min design gap + 30 min GitHub cron-drift grace. The old value
      # (75) was tighter than the schedule itself and produced guaranteed false
      # REDs at the 01:30/05:30 runs and on Fri/Sat (the 2026-06-11 failures).
      - name: Watch the watchdog
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/pipeline_watchdog.py --check-watchdog 150

