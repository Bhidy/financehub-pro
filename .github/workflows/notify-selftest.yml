name: Notify Selftest (temporary)

# TEMPORARY: one controlled exercise of scripts/notify.py's email path with the
# real NOTIFICATION_EMAIL/SMTP_PASSWORD secrets (set 2025-12-31, never wired into
# any workflow — the email alert layer has been silently inert). The step never
# fails (|| true): the JSON status in the log is the evidence. Removed after.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: exercise alert channels (read-only)
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send test alert via notify.py
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python3 scripts/notify.py "Starta alert self-test" "SMTP path verification from the hetzner-prod runner (alerting-hardening session, 2026-06-11). If you received this, the email alert channel works." || true
