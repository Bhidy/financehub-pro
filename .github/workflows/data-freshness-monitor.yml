name: Data Freshness Monitor

# ============================================================
# The alarm that was MISSING during the June 2026 freeze.
# production_watchdog.yml only checks "is the server up" (200 /health),
# so prices stayed frozen for hours while every check was green.
# This watches DATA freshness, not server liveness, during market hours.
#
# Freshness source: /api/v1/admin/data/freshness returns
#   { "prices": <ISO ts of newest market_tickers row>, "system_time": <ISO now> }
# Age = system_time - prices (uses the server's own clock, no runner skew).
# ============================================================

on:
  schedule:
    # Every 15 min during EGX/KSA market hours (07-14 UTC = 09-16 Cairo/Riyadh), Sun-Thu
    - cron: '*/15 7-14 * * 0,1,2,3,4'
  workflow_dispatch:

concurrency:
  group: data-freshness-monitor
  cancel-in-progress: true

env:
  API: https://starta.46-224-223-172.sslip.io

permissions:
  contents: read

jobs:
  freshness:
    name: Check price freshness
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 5
    env:
      HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Set up jq
        run: sudo apt-get install -y jq

      - name: Probe price freshness
        id: check
        run: |
          FR=$(curl -s --max-time 20 "$API/api/v1/admin/data/freshness" || echo '{}')
          ST=$(curl -s --max-time 20 "$API/api/v1/admin/refresh/status" || echo '{}')
          echo "Freshness: $FR"
          echo "Status:    $ST"

          PRICES=$(echo "$FR" | jq -r '.prices // empty')
          SYS=$(echo "$FR" | jq -r '.system_time // empty')
          LAST_STATUS=$(echo "$ST" | jq -r '.last_status // "unknown"')

          STALE=0
          REASON=""
          AGE_MIN="n/a"

          if [ -z "$PRICES" ]; then
            STALE=1
            REASON="no price timestamp from API"
          else
            # Strip sub-seconds for portable GNU date parsing
            P_CLEAN=$(echo "$PRICES" | sed -E 's/\.[0-9]+//')
            S_CLEAN=$(echo "$SYS"    | sed -E 's/\.[0-9]+//')
            P_EPOCH=$(date -d "$P_CLEAN" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -d "$S_CLEAN" +%s 2>/dev/null || date -u +%s)
            if [ "$P_EPOCH" -gt 0 ]; then
              AGE_MIN=$(( (NOW_EPOCH - P_EPOCH) / 60 ))
              # During market hours a 5-min refresh should keep this well under 1h
              if [ "$AGE_MIN" -gt 60 ]; then STALE=1; REASON="prices ${AGE_MIN}m old"; fi
            else
              STALE=1; REASON="unparseable price timestamp ($PRICES)"
            fi
          fi

          # Backend self-reported failure (with the yfinance fallback in place, a
          # healthy run is "success"; partial_failure/error means real trouble).
          case "$LAST_STATUS" in
            *error*|*partial_failure*) STALE=1; REASON="${REASON:+$REASON; }backend status=$LAST_STATUS";;
          esac

          # ---- CHART DATA (ohlc_data) freshness check --------------------------------
          # ohlc_data is the source the public chart reads. The reservoir (data_sync.yml)
          # writes it every 4h. A prior asyncpg date-type bug caused 100% silent failures
          # for 3+ days — this gate would have caught it on the first post-close cycle.
          # We probe via the public frontend API so we test the full stack (DB -> Vercel).
          # Threshold: ohlc_data max date must not be more than 2 trading days behind
          # today (handles weekends + the 4h write window after market close).
          OHLC_DATE=$(curl -s --max-time 20 "https://startamarkets.com/api/v1/egx/history/COMI" \
            | jq -r 'if type=="array" and length>0 then last | .date else empty end' 2>/dev/null || echo "")
          TODAY_EPOCH=$(date -u +%s)
          OHLC_STALE=0
          if [ -z "$OHLC_DATE" ]; then
            OHLC_STALE=1
            REASON="${REASON:+$REASON; }chart ohlc_data: no COMI bars returned"
          else
            OHLC_EPOCH=$(date -d "$OHLC_DATE" +%s 2>/dev/null || echo 0)
            if [ "$OHLC_EPOCH" -gt 0 ]; then
              OHLC_AGE_DAYS=$(( (TODAY_EPOCH - OHLC_EPOCH) / 86400 ))
              echo "ohlc_data latest bar: $OHLC_DATE (${OHLC_AGE_DAYS}d ago)"
              # Allow up to 4 days for weekends + holiday buffer; >4 = genuine freeze
              if [ "$OHLC_AGE_DAYS" -gt 4 ]; then
                OHLC_STALE=1
                REASON="${REASON:+$REASON; }chart data frozen: last OHLC bar ${OHLC_DATE} (${OHLC_AGE_DAYS}d ago)"
              fi
            fi
          fi
          [ "$OHLC_STALE" = "1" ] && STALE=1
          # ----------------------------------------------------------------------------

          {
            echo "age_min=$AGE_MIN"
            echo "last_status=$LAST_STATUS"
            echo "reason=$REASON"
            echo "stale=$STALE"
          } >> "$GITHUB_OUTPUT"

          # Signal hygiene: stale DATA is paged via Discord below, but the run stays
          # GREEN — a RED run on this monitor now unambiguously means the MONITOR
          # itself broke (API unreachable, jq error), not merely stale prices.
          if [ "$STALE" = "1" ]; then
            echo "::warning::DATA STALE — $REASON (age=${AGE_MIN}m, last_status=$LAST_STATUS) — paging Discord"
          else
            echo "✅ Prices fresh — age=${AGE_MIN}m, last_status=$LAST_STATUS | chart bar: $OHLC_DATE"
          fi

      - name: Alert Discord on stale data
        if: steps.check.outputs.stale == '1' && env.HAS_DISCORD != ''
        run: |
          MSG=$(printf '🟠 **DATA FRESHNESS ALERT** — prices may be frozen on startamarkets.com\n• reason: `%s`\n• price age: `%s min` | last_status: `%s`\n• Run: https://github.com/%s/actions/runs/%s' \
            "${{ steps.check.outputs.reason }}" "${{ steps.check.outputs.age_min }}" "${{ steps.check.outputs.last_status }}" "${{ github.repository }}" "${{ github.run_id }}")
          jq -n --arg c "$MSG" '{content: $c}' | curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" -H "Content-Type: application/json" -d @-
