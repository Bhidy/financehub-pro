name: SSHD Config Dump (temporary)

# TEMPORARY read-only probe: external root-ssh is blocked by a per-source rule
# the targeted grep missed (genuine sshd banner confirmed from outside; normal
# publickey denial from inside). Dump the FULL sshd config + every drop-in to
# find the Match/deny rule. Always exits 0. Removed once the rule is identified.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: full sshd config + drop-ins (read-only)
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 5
    steps:
      - name: Dump sshd configuration
        run: |
          echo "===== /etc/ssh/sshd_config (full) ====="
          cat /etc/ssh/sshd_config 2>/dev/null || echo "unreadable"
          echo "===== drop-ins directory ====="
          ls -la /etc/ssh/sshd_config.d/ 2>/dev/null || echo "none"
          for f in /etc/ssh/sshd_config.d/*; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            cat "$f" 2>/dev/null || echo "unreadable"
          done
          echo "===== tcp wrappers ====="
          cat /etc/hosts.deny 2>/dev/null || echo "no hosts.deny"
          cat /etc/hosts.allow 2>/dev/null || echo "no hosts.allow"
