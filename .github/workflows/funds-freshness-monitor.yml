name: Funds Freshness Monitor

# ============================================================
# The alarm that was MISSING during the funds freeze: data-freshness-monitor.yml
# watches PRICES only, so mutual-fund NAVs rotted for weeks (most funds 2026-05-20
# or older; a large cohort frozen at 2026-01-07) while every check stayed green.
#
# 2026-08-15 audit — the harder lesson. The two checks THIS file ran were also
# incapable of catching the real failure:
#   * newest fund NAV across all ids  -> satisfied by ANY ONE healthy fund
#   * >= 30 funds fresh within 10 days -> satisfied by the list-API trickle,
#     which writes one point per day for ~183 funds
# Both passed with six-fold headroom for fourteen months while 61 funds carried a
# 13-month hole in the middle of their history and 26 had no history at all. The
# failure mode is PER-FUND; every check was AGGREGATE. No threshold fixes that.
#
# So this job now REFRESHES the per-fund quality ledger (fund_data_quality:
# cadence, coverage, defect gaps, grade) and probes THAT distribution.
#
# Signal contract (2026-06-11): stale DATA FAILS the run (exit 2) — the red run's
# GitHub mobile push IS the page (Discord no longer exists). Thresholds are
# wall-day scale, so weekends and holidays cannot false-page. A MISSING, EMPTY or
# STALE ledger reports UNKNOWN and fails: a check that cannot see anything must
# never report health (learned the hard way — the first live run of this monitor
# reported "0 funds below grade C" and went green because the compute job had
# failed on all 363 funds and left the table empty).
# Requires repo secret DATABASE_URL.
# ============================================================

on:
  schedule:
    # Daily after each scheduled update window, Sun-Thu
    - cron: '0 7 * * 0-4'    # ~10:00 Cairo (after the 08:00 update)
    - cron: '0 18 * * 0-4'   # ~21:00 Cairo (after the 19:00 update)
  workflow_dispatch:

concurrency:
  group: funds-freshness-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: Check fund NAV freshness
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install asyncpg

      - name: Refresh per-fund quality ledger
        id: ledger
        # continue-on-error: a broken compute must not SKIP the probe below and
        # thereby silence the alarm. The probe treats an empty or stale ledger as a
        # failure in its own right, so the signal survives either way.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend-core/scripts/compute_fund_data_quality.py --min-scored 50

      - name: Probe fund freshness and per-fund quality
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # --max-below-grade 306 is a RATCHET pinned to the measured baseline of
          # 2026-08-15, NOT a health target. 306 of 363 funds currently grade D or
          # F, dominated by the 2025-05 -> 2026-06 upstream freeze that no source
          # can fill until the P4 backfill lands.
          #
          # This monitor has already proved it can see that: at 150 it failed on
          # production naming 306 funds and fund 2735's 1931-day hole. Leaving it
          # there would keep the job permanently red, and a permanently-red job
          # gets muted — the exact failure this audit is about. Pinned to the
          # baseline instead, ANY increase fails immediately while the known debt
          # is worked down.
          #
          # Lower this number as the backfill lands. Raising it requires evidence
          # that the universe legitimately grew — never to silence a regression.
          # Two further signals stay live regardless: regression against the
          # previous snapshot, and an empty/stale ledger reporting UNKNOWN.
          python backend-core/scripts/funds_nav_updater.py \
            --monitor --stale-days 5 --max-below-grade 306
