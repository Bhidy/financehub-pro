name: Symbol Data-Quality Gate

# ============================================================
# The tripwire for the June-2026 symbol-page incident class:
#   * NUMERIC-as-string -> .toFixed() crash (Technicals tab blanked the app)
#   * EGP-millions leaked as units ("EGP 82.24K" for an 82.24B net income)
#   * total equity shown as "Book Value / Share" (231514 vs ~68)
#   * statement-table vs profile net-income disagreement
#   * financials going stale (income_statements has no live writer)
# Probes the LIVE public API for a representative basket and fails RED +
# pages Discord on any violation, so a bad deploy is caught before users.
# ============================================================

on:
  schedule:
    - cron: '17 6 * * 0,1,2,3,4'   # 06:17 UTC, Sun-Thu (trading days)
    - cron: '17 6 * * 6'           # 06:17 UTC, Sat — weekend tripwire so a Friday-close (last trading day Thu) data-corruption is caught before Monday
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/app/api/v1/**'
      - 'frontend/app/symbol/**'
      - 'frontend/lib/db-server.ts'
      - 'backend-core/migrations/**'

concurrency:
  group: symbol-data-quality
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Probe live symbol data quality
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run data-quality gate
        run: |
          # Push deploys can lag a few seconds behind the workflow trigger.
          if [ "${{ github.event_name }}" = "push" ]; then sleep 60; fi
          python scripts/symbol_data_quality_gate.py --year "$(date +%Y)"
