name: Database Backup (off-site)

# Free, off-site, retained, integrity-checked DB backup — fixes the DR gap where
# the only backup was a single pg_dump file on the Hetzner box itself
# (/app/backups/financehub_weekly.sql.gz), overwritten weekly, with no off-site
# copy, no history, and no restore verification: if that disk died, so did the
# backup. This runs pg_dump from GitHub (off the prod host), verifies the dump,
# and keeps each run as a versioned artifact — $0.
#
# SECRET REQUIRED: SUPABASE_DIRECT_URL — the DIRECT (session-mode, port 5432)
# connection string from Supabase → Project Settings → Database → Connection
# string → "Direct connection". pg_dump needs a session connection; the pooled
# DATABASE_URL (port 6543, transaction mode) does NOT work for pg_dump. If the
# secret is missing the run fails LOUD (a visible failure beats a silent fake
# backup).

on:
  schedule:
    - cron: '0 3 * * 4'     # Thursdays 03:00 UTC (weekly), matches the old tier7 slot
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump → verify → off-site artifact
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 30
    steps:
      - name: Ensure pg_dump is available (auto-install if needed)
        run: |
          set -euo pipefail
          if command -v pg_dump >/dev/null 2>&1; then
            echo "pg_dump already installed: $(pg_dump --version)"
            exit 0
          fi
          # No passwordless sudo on this runner — self-install via apt-get download
          # (downloads the .deb without root, then dpkg -x extracts the binary).
          # libpq5 is already on the system (psycopg2-binary depends on it), so we
          # only need the client package itself.
          echo "pg_dump not found — self-installing via apt-get download (no sudo)"
          PGDIR=$(mktemp -d /tmp/pgclient.XXXXXX)
          (cd "$PGDIR" && apt-get download postgresql-client-16 libpq5 2>/dev/null) || {
            echo "::error::apt-get download failed — check internet access or apt index on runner"
            exit 1
          }
          for deb in "$PGDIR"/*.deb; do dpkg -x "$deb" "$PGDIR"; done
          PG_BIN_DIR=$(find "$PGDIR" -name "pg_dump" -type f 2>/dev/null | head -1 | xargs dirname 2>/dev/null || true)
          if [ -z "$PG_BIN_DIR" ]; then
            echo "::error::pg_dump binary not found after deb extraction"
            exit 1
          fi
          PG_LIB_DIR=$(find "$PGDIR/usr" -maxdepth 6 -name "libpq.so*" 2>/dev/null | head -1 | xargs dirname 2>/dev/null || true)
          echo "$PG_BIN_DIR" >> "$GITHUB_PATH"
          [ -n "$PG_LIB_DIR" ] && echo "LD_LIBRARY_PATH=${PG_LIB_DIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"
          echo "✓ pg_dump self-installed: $("$PG_BIN_DIR/pg_dump" --version)"

      - name: Dump + verify
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::SUPABASE_DIRECT_URL secret is not set — cannot take a real backup."
            exit 1
          fi
          STAMP="$(date -u +%Y%m%d-%H%M)"
          OUT="financehub-${STAMP}.sql.gz"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          # --no-owner/--no-privileges keep the dump portable for restore into any DB.
          pg_dump --no-owner --no-privileges --format=plain "$DIRECT_URL" | gzip -9 > "$OUT"
          # Integrity: gzip must be valid AND the dump must be plausibly large (a
          # failed/empty dump is a few bytes — never let that masquerade as a backup).
          gzip -t "$OUT"
          SIZE=$(stat -f%z "$OUT" 2>/dev/null || stat -c%s "$OUT")
          echo "backup size: ${SIZE} bytes"
          if [ "$SIZE" -lt 102400 ]; then
            echo "::error::backup is only ${SIZE} bytes (<100KB) — almost certainly a failed/empty dump."
            exit 1
          fi
          # Sanity: the decompressed dump must contain core tables.
          for t in market_tickers ohlc_data mutual_funds; do
            if ! zcat "$OUT" | grep -q "CREATE TABLE.*\b${t}\b\|COPY .*\b${t}\b"; then
              echo "::warning::table '${t}' not found in dump (verify schema)."
            fi
          done
          echo "✓ backup verified: $OUT (${SIZE} bytes)"

      - name: Upload off-site artifact (retained, versioned)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          retention-days: 30
          if-no-files-found: error
