name: SEO Daily Intelligence

# ============================================================
# The scheduled half of the SEO operating system.
#
# Runs the FULL forensic crawl (money pages + a deterministic sample of every
# sitemap segment), pulls Search Console performance when a credential is
# configured, and posts one prioritised brief to the ops Discord channel.
#
# It does NOT fail on medium/low findings — a daily red run that nobody can
# action is how monitoring gets ignored. It fails only on CRITICAL, which is
# the class that costs indexation.
#
# EXTERNAL CONFIGURATION (all optional; every one degrades honestly without it,
# reporting `configured: false` rather than an estimated figure):
#   GSC_SERVICE_ACCOUNT_JSON  Google Cloud service-account key (raw JSON or
#     base64) for a service account added as a user on the Search Console
#     property. Powers scripts/seo/gsc.mjs.
#   SERP_PROVIDER + SERP_API_KEY  a licensed SERP provider (dataforseo |
#     serpapi). Competitor rankings are not available from Search Console and
#     are never estimated. Powers scripts/seo/serp.mjs.
#   BING_WEBMASTER_API_KEY  Bing Webmaster Tools → Settings → API access.
#     Covers SEARCH performance only: Bing's AI Performance report (citations,
#     grounding queries, citation share) is dashboard-only with no documented
#     API, so AI citations are ingested from its CSV export via
#     `node scripts/seo/bing.mjs --import-ai <file>`.
# ============================================================

on:
  schedule:
    # 06:15 UTC = 08:15 Cairo, before the EGX opens and after the overnight
    # NAV + news pipelines have run, so the crawl sees the day's real state.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'URLs sampled per sitemap segment'
        required: false
        default: '25'

concurrency:
  group: seo-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  intelligence:
    name: Full audit · search intelligence · report
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Full SEO forensic audit
        working-directory: frontend
        # continue-on-error: a critical finding must still produce a REPORT.
        # Failing the step here would skip the notification and hide the very
        # thing that needs escalating.
        continue-on-error: true
        id: audit
        run: |
          node scripts/seo/audit.mjs \
            --sample "${{ github.event.inputs.sample || '25' }}" \
            --out /tmp/seo-audit.json \
            --fail-on critical

      - name: Search Console intelligence
        working-directory: frontend
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/seo/gsc.mjs --days 28 --out /tmp/seo-gsc.json

      - name: Competitive scorecard (Starta vs snduk)
        working-directory: frontend
        # Never fails the run: the competitor is a third party whose
        # availability we do not control, and a scorecard we cannot fetch is a
        # missing measurement, not a regression on our side.
        continue-on-error: true
        run: node scripts/seo/competitor.mjs --out /tmp/seo-competitor.json

      - name: Duplicate and same-intent detection (news)
        working-directory: frontend
        # Reports only. Consolidating editorial content is a human decision:
        # an automated merge of two financial stories can destroy a correction.
        continue-on-error: true
        run: node scripts/seo/duplicates.mjs --segment news --sample 300 --out /tmp/seo-duplicates.json

      - name: Competitor rank tracking
        working-directory: frontend
        # Reports `configured: false` and NO rankings without a licensed
        # provider. It never estimates a position.
        continue-on-error: true
        env:
          SERP_PROVIDER: ${{ secrets.SERP_PROVIDER }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: node scripts/seo/serp.mjs --out /tmp/seo-serp.json

      - name: Bing search + AI citation intelligence
        working-directory: frontend
        continue-on-error: true
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/seo/bing.mjs --days 30 --out /tmp/seo-bing.json

      - name: Compose and send the intelligence report
        working-directory: frontend
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node scripts/seo/report.mjs \
            --audit /tmp/seo-audit.json \
            --gsc /tmp/seo-gsc.json \
            --competitor /tmp/seo-competitor.json \
            --serp /tmp/seo-serp.json \
            --bing /tmp/seo-bing.json \
            --duplicates /tmp/seo-duplicates.json \
            --experiments content/seo-experiments.json \
            --out /tmp/seo-report.md \
            --notify
          echo "## SEO Intelligence Report" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/seo-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Experiments due for measurement
        working-directory: frontend
        # No `if:` — the script below decides. An earlier version guarded this
        # with an expression whose second clause was always false, so the step
        # was skipped on every scheduled run and the weekly review never
        # happened at all.
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/seo/experiments.mjs due | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "not Monday — experiment review skipped"
          fi

      - name: Archive the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-daily-${{ github.run_id }}
          path: |
            /tmp/seo-audit.json
            /tmp/seo-gsc.json
            /tmp/seo-competitor.json
            /tmp/seo-duplicates.json
            /tmp/seo-serp.json
            /tmp/seo-bing.json
            /tmp/seo-report.md
          if-no-files-found: warn
          retention-days: 90

      - name: Refresh IndexNow (full resubmit on Mondays, delta otherwise)
        # Gated on the AUDIT's own outcome, not on success(), which would
        # silently depend on this step's position relative to the failure gate
        # below. Deliberately skipped when the audit found a critical
        # regression: asking search engines to recrawl a site we know is
        # currently broken makes the regression propagate faster.
        if: github.event_name == 'schedule' && steps.audit.outcome == 'success'
        working-directory: frontend
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            node scripts/seo/indexnow.mjs --all
          else
            node scripts/seo/indexnow.mjs --since 24h
          fi

      - name: Fail the run if the audit found a critical regression
        # Deliberately LAST: the report has already been composed, sent to
        # Discord and archived, so the escalation carries its evidence.
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::SEO audit reported a CRITICAL finding — see the report above."
          exit 1
