<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Starta Markets</title>
    <meta name="description" content="Your portfolio dashboard — performance, holdings, analytics and AI insights.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/news-public.css">

<body>
    <div class="backdrop"></div>
    <div class="aurora"></div>
    <nav class="site-nav">
        <div class="nav-inner">
            <a class="brand" href="/"><span class="brand-mark display">S</span><span class="brand-name display">STARTA</span></a>
            <div class="nav-links">
                <a href="/" data-key="nav_home">HOME</a>
                <a href="/Funds" data-key="nav_funds">MUTUAL FUNDS</a>
                <a href="/Market-Pulse" data-key="nav_pulse">MARKET PULSE</a>
                <a href="/News" data-key="nav_news">MARKET NEWS</a>
                <a class="active" href="/Portfolio" data-key="nav_portfolio">PORTFOLIO</a>
                <a href="/Learn" data-key="nav_learn">LEARN</a>
            </div>
            <div class="nav-controls" style="display:flex;align-items:center;gap:.55rem;">
                <button id="themeToggle" class="control-btn" type="button" aria-label="Toggle theme">
                    <svg class="dark-icon" style="width:1.2rem;height:1.2rem;position:absolute;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <svg class="light-icon" style="width:1.2rem;height:1.2rem;position:absolute;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                </button>
                <button id="langToggle" class="lang-toggle display" type="button">AR</button>
            </div>
        </div>
    </nav>

    <!-- Sticky portfolio header + KPI strip -->
    <div class="pf-dash-header" id="pfDashHeader"></div>

    <!-- Main content -->
    <div class="pf-page" style="padding-top: calc(5rem + 56px);">
        <div class="pf-dash-body">
            <div id="pfDashBody"></div>
        </div>
    </div>

    <!-- Add Transaction Modal -->
    <div id="addTxModal" class="pf-modal-overlay">
        <div class="pf-modal">
            <div class="pf-modal-head">
                <h3 id="addTxTitle">Add Transaction</h3>
                <button class="pf-modal-close" id="closeAddTx" aria-label="Close">&times;</button>
            </div>
            <div id="addTxBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/assets/portfolio-store.js"></script>
    <script src="/assets/portfolio-detail.js"></script>

</html>
