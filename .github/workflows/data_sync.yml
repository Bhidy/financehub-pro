name: Enterprise Data Reservoir Sync

on:
  schedule:
    # Every 4h at :30 — same cadence (watchdog interval-SLA is 6h) but OFF the
    # :00 cluster: 16:00 UTC used to stack this with funds/stats/reconcile on the
    # single runner. 13:30 lands right after EGX close (11:30 UTC) for EOD bars.
    - cron: '30 1,5,9,13,17,21 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: data-reservoir-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write               # notify.py last-resort channel: alert → GitHub issue

jobs:
  fill-reservoir:
    name: "Ingest Deep Financial Data"
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 60

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: Install Enterprise Dependencies
        run: |
          pip install --upgrade pip
          # curl_cffi enables the reservoir's Chrome-impersonation session (anti-block);
          # without it the script logs "High Risk of Block" and falls back to plain requests.
          pip install yfinance asyncpg pandas requests beautifulsoup4 httpx python-dotenv curl_cffi

      - name: Run Primary Ingestion (Yahoo Finance)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ingestion/populate_yahoo_reservoir.py

      # Watch the watchman: independently verify the Pipeline Watchdog itself is
      # still running — a stale heartbeat FAILS this step (red run = GitHub page).
      # This + the watchdog watching data_sync = mutual dead-man's-switch.
      #
      # THRESHOLD = 480 min (8h), grounded in MEASURED reality, not cron theory.
      # ---------------------------------------------------------------------------
      # Earlier values (75, then 150) assumed the watchdog's cron schedule (~24
      # runs/day, max 2h gap) is honored. IT IS NOT. Measured over 2026-06-08→12,
      # the watchdog actually fired 8.4×/day with a MAX real gap of 301 min and a
      # MEDIAN of 186 min — because GitHub drops the majority of `schedule` events
      # when all ~16 workflows queue on the single self-hosted runner (and hosted
      # runners are billing-blocked, so there is no second runner). 20 of 29 real
      # gaps exceeded 150, so a 150 threshold would false-RED on MOST runs — that
      # was the recurring "WATCHDOG STALE" pager.
      #
      # 480 cleanly separates NORMAL drop-gaps (observed worst 301 min, ~60% margin)
      # from a GENUINELY dead watchdog (disabled / runner offline = 12h+ of silence,
      # still caught). Detecting monitor-death at 8h instead of 2h is fine: this is a
      # BACKSTOP. Real data-freshness is guaranteed independently and within minutes
      # by the EXTERNAL UptimeRobot probe of /api/v1/health/freshness (Vercel→
      # Supabase), which does not depend on GitHub Actions at all. Do NOT lower this
      # to "tighten" monitoring — that just reintroduces alarm-fatigue false REDs.
      - name: Watch the watchdog
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/pipeline_watchdog.py --check-watchdog 480

