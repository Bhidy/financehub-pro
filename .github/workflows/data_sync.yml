name: Enterprise Data Reservoir Sync

on:
  schedule:
    - cron: '0 */4 * * *' # Run every 4 hours (Free tier allows this comfortably)
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: data-reservoir-sync
  cancel-in-progress: false

jobs:
  fill-reservoir:
    name: "Ingest Deep Financial Data"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          
      - name: Install Enterprise Dependencies
        run: |
          pip install --upgrade pip
          # curl_cffi enables the reservoir's Chrome-impersonation session (anti-block);
          # without it the script logs "High Risk of Block" and falls back to plain requests.
          pip install yfinance asyncpg pandas requests beautifulsoup4 httpx python-dotenv curl_cffi

      - name: Run Primary Ingestion (Yahoo Finance)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ingestion/populate_yahoo_reservoir.py

      # Watch the watchman: independently verify the Pipeline Watchdog itself is
      # still running (alerts Discord if its heartbeat is stale). This + the
      # watchdog watching data_sync = mutual dead-man's-switch, no single blind spot.
      - name: Watch the watchdog
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/pipeline_watchdog.py --check-watchdog 75

